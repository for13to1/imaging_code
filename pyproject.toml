[project]
name = "imaging_code"
version = "0.1.0"
description = "imaging_code"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.4.4",
    "matplotlib>=3.10.8",
    "opencv-python>=4.13.0.92",
    "black>=26.3.1",
    "scipy>=1.17.1",
    "bm3d>=4.0.3",
    "bm4d>=4.2.5",
    "ruff>=0.15.22",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E741",   # ambiguous variable name (I, O, l — common in math/academic code)
    "SIM108", # use ternary operator (if-else clearer for complex branches)
    "RUF001", # ambiguous unicode in string (Chinese punctuation)
    "RUF002", # ambiguous unicode in docstring
    "RUF003", # ambiguous unicode in comment
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
